<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultraviolet Proxy</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      flex-direction: column;
    }
    input {
      width: 300px;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    button {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      background: #1e90ff;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>
<body>

<h2>Ultraviolet Proxy</h2>

<input id="site" placeholder="example.com or https://..." autocomplete="off">
<button onclick="go()">Go</button>

<!-- Load the main UV client bundle -->
<script src="./src/uv.bundle.js"></script>
<script src="./src/uv.config.js"></script>

<script>
  // Register the service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./src/sw.js', { scope: '/' })
      .catch(err => console.error('SW registration failed:', err));
  }

  function go() {
    let url = document.getElementById('site').value.trim();

    // Add https:// if missing
    if (!/^https?:\/\//i.test(url)) {
      url = 'https://' + url;
    }

    // Encode URL using the UV client
    const proxied = __uv$config.encodeUrl(url);

    // Redirect to proxied URL
    window.location.href = proxied;
  }
</script>

</body>
</html>
